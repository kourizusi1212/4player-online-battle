<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4人3Dバトル</title><style>
*{box-sizing:border-box}body{margin:0;background:#090c12;color:#fff;font-family:system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100vh}
#lobby{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#25324b,#080b10);z-index:10}.card{width:min(420px,92vw);padding:28px;border-radius:20px;background:#121824dd;border:1px solid #ffffff22;box-shadow:0 20px 80px #000}.card h1{margin-top:0}.card input,.card button{width:100%;padding:13px;margin:7px 0;border:0;border-radius:10px;font-size:16px}.card button{cursor:pointer;font-weight:700;background:#fff}.room{font-size:38px;letter-spacing:8px;text-align:center;padding:10px;color:#ffd447}.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.p{padding:9px;background:#ffffff0b;border-radius:8px}.hide{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:14px 18px;font-weight:700;text-shadow:0 2px 4px #000}.hp{position:absolute;left:18px;bottom:20px;width:250px;height:22px;background:#222;border:2px solid #fff;border-radius:9px;overflow:hidden}.bar{height:100%;background:#4fe083}.hptext{position:absolute;left:28px;bottom:23px}.cross{position:absolute;left:50%;top:50%;font-size:30px;transform:translate(-50%,-50%);text-shadow:0 0 8px #fff}.gun{position:absolute;left:50%;bottom:0;width:180px;height:130px;transform:translateX(-50%);background:linear-gradient(120deg,#333,#111);clip-path:polygon(40% 100%,48% 35%,100% 30%,100% 65%,60% 70%,58% 100%)}#msg{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);font-size:40px;font-weight:900;text-align:center;text-shadow:0 4px 15px #000}
</style></head><body><div id="lobby"><div class="card"><h1>🎮 4人3Dバトル</h1><input id="name" placeholder="プレイヤー名" maxlength="12"><input id="room" placeholder="部屋番号（4桁）" maxlength="4" value="1234"><button id="join">部屋に入る</button><div id="inside" class="hide"><div>部屋番号</div><div class="room" id="rid"></div><div class="players" id="plist"></div><button id="start">対戦開始</button><small>2〜4人で開始できます</small></div><div id="err"></div></div></div>
<canvas id="c"></canvas><div id="hud" class="hide"><div class="top"><span>ROOM <b id="roomhud"></b></span><span id="score"></span></div><div class="hp"><div class="bar" id="bar"></div></div><div class="hptext">HP <b id="hp"></b></div><div class="cross">+</div><div class="gun"></div><div id="msg"></div></div>
<script src="game.js"></script></body></html>
