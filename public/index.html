<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4人オンライン3Dバトル - Rebuild</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c13;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
canvas{display:block;width:100vw;height:100vh}
button,input,select{font:inherit}
#lobby{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#334a69,#090d14 65%)}
.card{width:min(560px,94vw);max-height:94vh;overflow:auto;padding:26px;border:1px solid #ffffff24;border-radius:22px;background:#101722ee;box-shadow:0 25px 100px #0009}
h1{margin:0 0 18px;font-size:28px}
input,select,button{width:100%;padding:13px;margin:6px 0;border:0;border-radius:11px}
input,select{background:#202a38;color:#fff;outline:none}
button{cursor:pointer;font-weight:800;background:#f2f5f8;color:#111}
button:hover{filter:brightness(1.08)}
.row{display:flex;gap:9px}.row>*{flex:1}
#joinbox{margin-top:6px}.hide{display:none!important}
#err{min-height:24px;color:#ff8585;margin-top:6px}
.mapbox{margin:8px 0;padding:10px;background:#ffffff0b;border-radius:12px}
.mapbox label{display:block;font-size:13px;color:#aab4c2;margin-bottom:4px}
.room{font-size:44px;letter-spacing:10px;text-align:center;color:#ffd94a;padding:8px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.p{padding:10px;border-radius:10px;background:#ffffff0a}
small{display:block;color:#aab4c2;margin-top:8px;line-height:1.5}
#hud{position:fixed;inset:0;pointer-events:none}
.top{display:flex;justify-content:space-between;gap:8px;padding:12px 16px;text-shadow:0 2px 5px #000;font-weight:800}
.top span{background:#0009;padding:7px 10px;border-radius:9px}
.hpbox{position:absolute;left:18px;bottom:18px;width:270px}
.hp{height:22px;border:2px solid #fff;border-radius:9px;overflow:hidden;background:#222}
.bar{height:100%;background:#4fe083;width:100%}
.hptext{margin-top:4px;font-weight:800}
.crosshair{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);filter:drop-shadow(0 1px 3px #000);transition:transform .12s,opacity .12s}.ch{position:absolute;display:block;background:#fff;border-radius:2px}.ch.top,.ch.bottom{left:15px;width:4px;height:9px}.ch.top{top:0}.ch.bottom{bottom:0}.ch.left,.ch.right{top:15px;width:9px;height:4px}.ch.left{left:0}.ch.right{right:0}.ch.dot{left:15px;top:15px;width:4px;height:4px;border-radius:50%}.crosshair.aim{transform:translate(-50%,-50%) scale(.72);opacity:.95}
.gun{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);width:240px;height:155px;background:linear-gradient(145deg,#555,#121212);clip-path:polygon(38% 100%,43% 36%,91% 28%,100% 38%,100% 64%,58% 72%,56% 100%)}
.weapon{position:absolute;right:18px;bottom:18px;padding:12px 15px;border-radius:12px;background:#000a;text-align:right;min-width:170px}
.killfeed{position:absolute;right:18px;top:68px;text-align:right;font-size:14px;line-height:1.7}
#msg{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;font-size:34px;font-weight:900;text-shadow:0 4px 18px #000;max-width:90vw}
.result{margin-top:10px;padding:14px;background:#000b;border-radius:13px;font-size:17px}
.rank{display:flex;justify-content:space-between;padding:5px 0}
#hint{margin-top:10px;padding:10px;background:#ffffff08;border-radius:10px;font-size:13px;color:#c5cfdb}
</style>
</head>
<body>
<div id="lobby">
 <div class="card">
  <h1>🎮 4人オンライン3Dバトル</h1>
  <input id="name" maxlength="12" placeholder="プレイヤー名">
  <div class="mapbox">
   <label>マップ</label>
   <select id="map">
    <option value="maze">迷路</option>
    <option value="arena">アリーナ</option>
    <option value="ruins">廃墟</option>
   </select>
  </div>
  <div class="row">
   <button id="create">🏠 部屋を作る</button>
   <button id="showjoin">🚪 部屋に参加</button>
  </div>
  <div id="joinbox" class="hide">
   <input id="roomInput" maxlength="4" inputmode="numeric" placeholder="4桁の部屋番号">
   <button id="join">参加する</button>
  </div>
  <div id="inside" class="hide">
   <div>部屋番号</div>
   <div class="room" id="rid">----</div>
   <button id="copy">📋 部屋番号をコピー</button>
   <div id="copymsg"></div>
   <div class="players" id="plist"></div>
   <button id="ready">✅ READY</button>
   <button id="start">対戦開始</button>
   <div id="hint">2〜4人。全員READY後、部屋主が開始できます。</div>
  </div>
  <div id="err"></div>
 </div>
</div>

<canvas id="game"></canvas>

<div id="hud" class="hide">
 <div class="top">
  <span>ROOM <b id="roomHud"></b></span>
  <span>⏱ <b id="timer">05:00</b></span>
  <span id="scoreHud"></span>
 </div>
 <div class="hpbox">
  <div class="hp"><div class="bar" id="bar"></div></div>
  <div class="hptext">HP <b id="hp">100</b></div>
 </div>
 <div id="crosshair" class="crosshair"><span class="ch top"></span><span class="ch bottom"></span><span class="ch left"></span><span class="ch right"></span><span class="ch dot"></span></div>
 <div class="gun"></div>
 <div class="weapon">
  <b id="weaponName">ハンドガン</b><br>
  弾 <b id="ammo">12</b> / <span id="mag">12</span>
  <small>1/2/3 武器　R リロード<br>左クリック 射撃　右クリック 長押しで照準<br>WASD 移動　マウス 視点</small>
 </div>
 <div class="killfeed" id="killfeed"></div>
 <div id="msg"></div>
</div>

<script src="game.js"></script>
</body>
</html>
