<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4人オンライン3Dバトル</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090c12;color:#fff;font-family:system-ui}canvas{display:block;width:100vw;height:100vh;image-rendering:auto}#lobby{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#25324b,#080b10);z-index:10}.card{width:min(500px,94vw);max-height:94vh;overflow:auto;padding:24px;border-radius:20px;background:#121824ee;border:1px solid #ffffff22;box-shadow:0 20px 80px #000}.card h1{margin-top:0}.card input,.card button,.card select{width:100%;padding:12px;margin:6px 0;border:0;border-radius:10px;font-size:16px}.card button{cursor:pointer;font-weight:700}.row{display:flex;gap:8px}.row>*{flex:1}.room{font-size:38px;letter-spacing:8px;text-align:center;padding:10px;color:#ffd447}.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.p{padding:9px;background:#ffffff0b;border-radius:8px}.hide{display:none!important}small{display:block;margin-top:8px;color:#bbb}#err{color:#ff8b8b;min-height:22px}.mapbox{padding:10px;background:#ffffff0a;border-radius:10px;margin-top:6px}.mapbox label{display:block;font-size:13px;color:#bbb;margin-bottom:3px}
#hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:12px 18px;font-weight:700;text-shadow:0 2px 4px #000}.top span{background:#0008;padding:5px 9px;border-radius:8px}.hp{position:absolute;left:18px;bottom:20px;width:250px;height:22px;background:#222;border:2px solid #fff;border-radius:9px;overflow:hidden}.bar{height:100%;background:#4fe083}.hptext{position:absolute;left:28px;bottom:23px}.cross{position:absolute;left:50%;top:50%;font-size:30px;transform:translate(-50%,-50%);text-shadow:0 0 8px #fff}.gun{position:absolute;left:50%;bottom:0;width:190px;height:140px;transform:translateX(-50%);background:linear-gradient(120deg,#444,#111);clip-path:polygon(40% 100%,48% 35%,100% 30%,100% 65%,60% 70%,58% 100%)}#msg{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);font-size:38px;font-weight:900;text-align:center;text-shadow:0 4px 15px #000}.weapon{position:absolute;right:18px;bottom:18px;background:#000a;padding:12px 16px;border-radius:12px;text-align:right}.killfeed{position:absolute;right:18px;top:65px;text-align:right;font-size:14px}.result{background:#000c;padding:18px;border-radius:15px;margin-top:10px}.rank{display:flex;justify-content:space-between;padding:5px 0}
</style></head><body><div id="lobby"><div class="card"><h1>🎮 4人オンライン3Dバトル</h1><input id="name" placeholder="プレイヤー名" maxlength="12"><div class="mapbox"><label>マップ</label><select id="map"><option value="maze">迷路</option><option value="arena">アリーナ</option><option value="ruins">廃墟</option></select></div><div class="row"><button id="create">🏠 部屋を作る</button><button id="showjoin">🚪 部屋に参加</button></div><div id="joinbox" class="hide"><input id="room" placeholder="4桁の部屋番号" maxlength="4" inputmode="numeric"><button id="join">参加する</button></div><div id="inside" class="hide"><div>部屋番号</div><div class="room" id="rid"></div><button id="copy">📋 部屋番号をコピー</button><div id="copymsg"></div><div class="players" id="plist"></div><button id="ready">✅ 準備完了</button><button id="start">対戦開始</button><small>2〜4人。全員READYで部屋主が開始できます。マップは部屋作成時に決まります。</small></div><div id="err"></div></div></div><canvas id="c"></canvas><div id="hud" class="hide"><div class="top"><span>ROOM <b id="roomhud"></b></span><span>⏱️ <b id="timer">05:00</b></span><span id="score"></span></div><div class="hp"><div class="bar" id="bar"></div></div><div class="hptext">HP <b id="hp"></b></div><div class="cross">+</div><div class="gun"></div><div class="weapon"><b id="weaponName">ハンドガン</b><br>弾 <b id="ammo">12</b> / <span id="mag">12</span><br><small>1/2/3 武器　R リロード　クリック/Space 射撃</small></div><div class="killfeed" id="killfeed"></div><div id="msg"></div></div><script src="game.js"></script></body></html>
